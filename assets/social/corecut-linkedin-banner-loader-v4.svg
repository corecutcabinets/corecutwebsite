<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1584"
  height="396"
  viewBox="0 0 1584 396"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Corecut Cabinets LinkedIn banner</title>
  <desc id="description">
    A minimal cream Corecut Cabinets banner inspired by the website loading
    animation, with the official logo and the slogan Quality at the Core. Cut to
    Last.
  </desc>

  <defs>
    <style>
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 400 800;
        src: url("../fonts/manrope-latin-var.woff2") format("woff2");
      }

      .brand-label {
        font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 3px;
      }

      .brand-slogan {
        font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
        font-size: 18px;
        font-weight: 760;
        letter-spacing: 3.1px;
      }
    </style>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.58" stop-color="#fdfcfa" />
      <stop offset="1" stop-color="#f6f0e8" />
    </linearGradient>

    <radialGradient id="warm-glow" cx="72%" cy="46%" r="46%">
      <stop offset="0" stop-color="#c5a071" stop-opacity="0.13" />
      <stop offset="0.5" stop-color="#c5a071" stop-opacity="0.055" />
      <stop offset="1" stop-color="#c5a071" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="slogan-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5a071" stop-opacity="0.15" />
      <stop offset="0.5" stop-color="#c5a071" />
      <stop offset="1" stop-color="#c5a071" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="progress-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5a071" />
      <stop offset="1" stop-color="#6f421b" />
    </linearGradient>

    <pattern id="minor-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path
        d="M 16 0 L 0 0 0 16"
        fill="none"
        stroke="#6f421b"
        stroke-opacity="0.035"
        stroke-width="1"
      />
    </pattern>

    <pattern id="major-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path
        d="M 80 0 L 0 0 0 80"
        fill="none"
        stroke="#6f421b"
        stroke-opacity="0.065"
        stroke-width="1"
      />
    </pattern>

    <radialGradient id="grid-fade" cx="73%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.78" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <mask id="grid-mask">
      <rect width="1584" height="396" fill="url(#grid-fade)" />
    </mask>

    <filter id="logo-shadow" x="-10%" y="-25%" width="120%" height="150%">
      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="10"
        flood-color="#4b2e19"
        flood-opacity="0.06"
      />
    </filter>
  </defs>

  <rect width="1584" height="396" fill="url(#background)" />
  <rect width="1584" height="396" fill="url(#warm-glow)" />

  <g mask="url(#grid-mask)">
    <rect width="1584" height="396" fill="url(#minor-grid)" />
    <rect width="1584" height="396" fill="url(#major-grid)" />
  </g>

  <line
    x1="792"
    y1="0"
    x2="792"
    y2="396"
    stroke="#6f421b"
    stroke-opacity="0.075"
  />

  <!-- The left side remains intentionally quiet for LinkedIn's profile photo. -->
  <g>
    <text
      class="brand-label"
      x="1090"
      y="72"
      fill="#4b2e19"
      fill-opacity="0.54"
      text-anchor="end"
    >CUSTOM CABINETRY</text>
    <circle cx="1112" cy="67" r="9" fill="#c5a071" fill-opacity="0.12" />
    <circle cx="1112" cy="67" r="2.5" fill="#c5a071" />
    <text
      class="brand-label"
      x="1134"
      y="72"
      fill="#4b2e19"
      fill-opacity="0.54"
      text-anchor="start"
    >EDMONTON</text>
  </g>

  <g fill="#4b2e19" fill-opacity="0.8">
    <text
      class="brand-slogan"
      x="894"
      y="318"
      text-anchor="middle"
    >QUALITY AT CORE</text>
    <rect x="1000" y="311.5" width="72" height="1" fill="url(#slogan-rule)" />
    <text
      class="brand-slogan"
      x="1268"
      y="318"
      text-anchor="middle"
    >CUT TO LAST</text>
  </g>

  <rect
    x="1031"
    y="355"
    width="170"
    height="1"
    fill="#4b2e19"
    fill-opacity="0.12"
  />
  <rect x="1031" y="355" width="126" height="1" fill="url(#progress-rule)" />
</svg>
